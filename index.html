<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>CEO: Do Zero ao Império</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CEO">
<style>
:root{--bg:#0b0f1a;--bg2:#10172a;--card:#161e33;--card2:#1f2944;--line:#2a3552;--tx:#eef1f7;--mu:#8d97ad;--gold:#e8b54d;--gold2:#ffd27a;--green:#45d38a;--red:#ff6b6b;--blue:#5aa9ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070d;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1d1406;font-weight:800;font-size:16px;letter-spacing:.2px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--tx);font-weight:700}
.btn.red{background:#3a1d24;color:var(--red)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.sm{padding:11px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.mu{color:var(--mu)}
.gold{color:var(--gold2)}
.green{color:var(--green)}
.red{color:var(--red)}
small{font-size:12px}

/* SPLASH */
#splash{align-items:center;justify-content:center;background:#000}
.splash-in{text-align:center;opacity:0;animation:fadeio 2.6s ease forwards}
.logo-m{width:84px;height:84px;margin:0 auto 14px;border:3px solid var(--gold);border-radius:22px;display:grid;place-items:center;font-size:46px;font-weight:900;color:var(--gold)}
.logo-t{font-size:22px;font-weight:900;letter-spacing:6px}
.logo-s{font-size:12px;letter-spacing:8px;color:var(--gold);margin-top:6px}
@keyframes fadeio{0%{opacity:0;transform:scale(.96)}25%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}

/* HOME */
#home{justify-content:flex-end;background:radial-gradient(120% 70% at 50% 10%,#1b2747 0%,#0b0f1a 60%)}
.skyline{position:absolute;left:0;right:0;bottom:38%;height:240px}
.home-c{position:relative;padding:28px 24px calc(28px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin-bottom:34px}
.brand small{letter-spacing:3px;color:var(--mu);font-size:11px}
.brand h1{font-size:86px;font-weight:900;letter-spacing:6px;line-height:1;margin-top:8px;background:linear-gradient(180deg,#fff2c8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h2{font-size:17px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#cfd6e6;margin-top:6px}
.home-btns{display:grid;gap:10px}
.update{margin-top:16px;text-align:center;font-size:13px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.update b{color:var(--gold2)}

/* CREATE */
#create{background:var(--bg)}
.cr-body{flex:1;overflow-y:auto;padding:22px 20px 12px}
.cr-body h2{font-size:24px;margin-bottom:4px}
.cr-prev{display:flex;justify-content:center;margin:16px 0}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.inp{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;outline:none}
.inp:focus{border-color:var(--gold)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--gold2)}
.sw.txt button{width:auto;height:auto;border-radius:10px;padding:8px 12px;background:var(--card);border:2px solid var(--line);font-size:14px}
.sw.txt button.on{border-color:var(--gold)}
.perfis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perfil{text-align:left;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.perfil.on{border-color:var(--gold);background:#231f17}
.perfil b{display:block;font-size:15px;margin-bottom:3px}
.perfil span{font-size:12px;color:var(--mu)}
.cr-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* GAME */
#game{background:var(--bg)}
.top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#141c31,#0f1527);border-bottom:1px solid var(--line)}
.top-row{display:flex;justify-content:space-between;align-items:center}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:40px;height:40px}
.me b{font-size:15px;display:block}
.me small{color:var(--mu)}
.cash{text-align:right}
.cash small{display:block;color:var(--mu);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.cash b{font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
.cash b.neg{color:var(--red)}
.top-row2{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px}
.daybar{flex:1;height:6px;background:#26304a;border-radius:4px;overflow:hidden}
.daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px}
.chip{padding:3px 9px;border-radius:20px;background:var(--card2);font-size:12px;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:14px 14px 20px}
.tabs{display:flex;border-top:1px solid var(--line);background:#0e1424;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 10px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--gold2)}
.tabs button.on i{filter:none;opacity:1}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:10px;font-weight:700}
.hq{padding:0;overflow:hidden}
.hq svg{display:block;width:100%;height:auto}
.hq-info{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.hq-info b{font-size:17px}
.obj{border-color:#5a4520;background:linear-gradient(180deg,#221c12,#18150f)}
.obj .cap{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:800}
.obj .tt{font-size:18px;font-weight:800;margin:4px 0 6px}
.prog{height:8px;background:#34291a;border-radius:6px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.fin div{background:var(--bg2);border-radius:12px;padding:10px 4px}
.fin small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
.fin b{font-size:15px;font-variant-numeric:tabular-nums}
.co{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.co-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.co-m{flex:1;min-width:0}
.co-m b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-m small{color:var(--mu)}
.co-r{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.co-r small{display:block;color:var(--mu);font-size:11px}
.warn{font-size:12px;color:#ffb35c;margin-top:4px}
.empty{text-align:center;color:var(--mu);padding:22px 10px;font-size:14px}

/* SHEET */
.sheet{position:absolute;inset:0;z-index:30;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(3,5,10,.6)}
.sheet-p{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sh-head h2{flex:1;font-size:19px}
.sh-x{width:36px;height:36px;border-radius:50%;background:var(--card2);font-size:16px}
.sh-body{overflow-y:auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom))}
.ramos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ramo{padding:14px 12px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-align:left;position:relative}
.ramo.on{border-color:var(--gold);background:#221d14}
.ramo .e{font-size:30px}
.ramo b{display:block;font-size:15px;margin-top:6px}
.ramo small{color:var(--mu)}
.ramo.lock{opacity:.45}
.ramo .lk{position:absolute;top:10px;right:10px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv>:last-child{text-align:right}
.kv:last-child{border:0}
.cg{margin-bottom:14px}
.cg-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.ess{font-size:10px;letter-spacing:1px;padding:2px 6px;border-radius:6px;background:#3a2c14;color:var(--gold2);text-transform:uppercase}
.slot{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.slot.free{border-style:dashed;justify-content:center;color:var(--gold2);font-weight:700;padding:14px}
.slot .av{width:44px;height:44px;flex-shrink:0}
.slot .m{flex:1;min-width:0}
.slot .m b{font-size:15px;display:block}
.st{color:var(--gold2);letter-spacing:1px;font-size:13px}
.tr{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;background:var(--card2);margin-left:4px}
.mbar{height:5px;background:#2b3450;border-radius:4px;overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:4px}
.cand{display:block;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.cand.on{border-color:var(--gold);background:#211c13}
.cand .top2{display:flex;gap:12px;align-items:center}
.cand .av{width:52px;height:52px}
.cand .det{margin-top:10px;font-size:13px;color:#cfd6e6;display:none}
.cand.on .det{display:block}
.lockc{padding:12px;border-radius:14px;border:1px dashed var(--line);color:var(--mu);font-size:13px;margin-bottom:8px;text-align:center}
.acts{display:grid;gap:8px;margin-top:6px}

/* TOASTS */
#toasts{position:absolute;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top));z-index:40;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.toast{background:rgba(22,30,51,.97);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;animation:tin .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* STORY */
.overlay{position:absolute;inset:0;z-index:50;display:none}
.overlay.on{display:block}
#story{background:radial-gradient(120% 80% at 50% 20%,#25314f 0%,#0a0e18 70%)}
.st-portrait{position:absolute;left:0;right:0;bottom:240px;display:flex;justify-content:center;transition:opacity .25s}
.st-portrait .av{width:220px;height:220px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.st-box{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:200px;background:rgba(13,18,32,.96);border:1px solid #3a4666;border-radius:20px;padding:30px 18px 18px}
.st-name{position:absolute;top:-15px;left:18px;background:var(--gold);color:#1d1406;font-weight:900;padding:5px 14px;border-radius:10px;font-size:14px;letter-spacing:.5px}
.st-name:empty{display:none}
.st-text{font-size:17px;line-height:1.5;min-height:100px}
.st-text.narr{font-style:italic;color:#cfd6e6;text-align:center;padding-top:8px}
.st-hint{position:absolute;right:16px;bottom:10px;font-size:11px;color:var(--mu);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.st-choices{display:grid;gap:8px;margin-top:12px}
.st-skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;color:var(--mu)}
.st-title{position:absolute;top:calc(60px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:800}

/* EVENT */
#evt{background:rgba(3,5,10,.75);display:none;align-items:center;justify-content:center;padding:20px}
#evt.on{display:flex}
.evt-card{width:100%;max-width:420px;background:linear-gradient(180deg,#1d2640,#141b2e);border:1px solid #3a4666;border-radius:22px;padding:22px 18px 18px;text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.evt-ic{font-size:44px;display:flex;justify-content:center}
.evt-ic .av{width:96px;height:96px}
.evt-tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:800;margin-top:8px}
.evt-card h3{font-size:21px;margin:6px 0 8px}
.evt-card p{font-size:15px;line-height:1.5;color:#d4dbea;margin-bottom:16px}
.opt{display:block;width:100%;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.opt b{display:block;font-size:15px}
.opt small{color:var(--mu)}
.opt:active{border-color:var(--gold)}

.ceo-h{display:flex;gap:14px;align-items:center}
.ceo-h .av{width:84px;height:84px}
.attr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border:0}
.attr .n{flex:1}
.attr .n small{display:block;color:var(--mu)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:14px;border-radius:2px;background:#2b3450}
.pips i.f{background:var(--gold)}
.plus{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#1d1406;font-weight:900;font-size:18px}
.leg{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#ff6b6b,#3a4666 50%,#45d38a);margin:10px 0 6px}
.leg i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:#fff;transform:translateX(-3px)}
.chap{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.chap:last-child{border:0}
.chap .s{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--card2);flex-shrink:0}
.chap .s.ok{background:#1f3a2c;color:var(--green)}
.chap .s.cur{background:var(--gold);color:#1d1406}
.chap .m{flex:1}
.chap .m small{color:var(--mu);display:block}
.licao{padding:10px 12px;border-radius:12px;background:#201b12;border:1px solid #4a3a1c;margin-bottom:8px;font-size:14px}
.licao i{color:#e9dcc0}
.licao small{display:block;color:var(--gold2);margin-top:4px}
</style>
</head>
<body>
<div id="app">

<div id="splash" class="screen on"><div class="splash-in"><div class="logo-m">M</div><div class="logo-t">MORAIS STUDIO</div><div class="logo-s">DESENVOLVEDOR</div></div></div>

<div id="home" class="screen">
  <svg class="skyline" viewBox="0 0 480 240" preserveAspectRatio="xMidYMax slice" id="skyline"></svg>
  <div class="home-c">
    <div class="brand"><small>MORAIS STUDIO APRESENTA</small><h1>CEO</h1><h2>Do Zero ao Império</h2></div>
    <div class="home-btns">
      <button class="btn" id="bContinue">Continuar</button>
      <button class="btn sec" id="bNew">Novo jogo</button>
    </div>
    <div class="update"><b>Nova atualização</b> · Base do jogo (v0.1)</div>
  </div>
</div>

<div id="create" class="screen">
  <div class="cr-body" id="crBody"></div>
  <div class="cr-foot"><button class="btn" id="bStart">Começar minha história</button></div>
</div>

<div id="game" class="screen">
  <header class="top">
    <div class="top-row">
      <div class="me" id="tMe"></div>
      <div class="cash"><small>Caixa</small><b id="tMoney">R$ 0</b></div>
    </div>
    <div class="top-row2"><span id="tDay">Dia 1</span><div class="daybar"><i id="tDayBar"></i></div><span class="chip" id="tRep">⭐ 30</span></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-t="hq" class="on"><i>🏢</i>Escritório</button>
    <button data-t="cos"><i>💼</i>Empresas<span class="dot" id="dotCos"></span></button>
    <button data-t="story"><i>📖</i>História</button>
    <button data-t="ceo"><i>👤</i>CEO<span class="dot" id="dotCeo"></span></button>
  </nav>
  <div id="sheet" class="sheet"><div class="sheet-bg" id="sheetBg"></div><div class="sheet-p" id="sheetP"></div></div>
  <div id="toasts"></div>
</div>

<div id="story" class="overlay">
  <div class="st-title" id="stTitle"></div>
  <div class="st-portrait" id="stP"></div>
  <div class="st-box" id="stBox"><div class="st-name" id="stN"></div><div class="st-text" id="stT"></div><div class="st-choices" id="stC"></div><div class="st-hint" id="stHint">toque para continuar ▸</div></div>
  <button class="st-skip" id="stSkip">Pular ▸▸</button>
</div>

<div id="evt" class="overlay"><div class="evt-card" id="evtCard"></div></div>

</div>
<script>
'use strict';
/* ================== DADOS ================== */
const DAY = 30;            // segundos reais por dia de jogo
const SAVE_KEY = 'ceo_imperio_v01';
const VERSION = '0.1';

const RAMOS = {
  alim:{nome:'Alimentação',e:'🍔',cor:'#ff8a4c',custo:3000,aluguel:60,base:320,sm:1.0,
    portes:['Lanchonete','Lanchonete','Restaurante','Restaurante','Rede de franquias'],
    cargos:[{n:'Cozinheiro',e:'👨‍🍳',p:1},{n:'Atendente',e:'🧾',p:.85},{n:'Entregador',e:'🛵',p:.9},{n:'Gerente',e:'👔',p:.5}],
    nomes:['Sabor da Vila','Lanche Esperança','Brasa & Pão','Cantinho Mineiro'],desc:'Barato de abrir, receita estável.'},
  moda:{nome:'Moda',e:'👕',cor:'#e35d9b',custo:3500,aluguel:75,base:350,sm:1.1,
    portes:['Brechó online','Brechó online','Marca própria','Marca própria','Grife'],
    cargos:[{n:'Costureira',e:'🧵',p:1},{n:'Vendedor',e:'🛍️',p:.85},{n:'Estilista',e:'✏️',p:.95},{n:'Social media',e:'📱',p:.5}],
    nomes:['Garimpo Chic','Vila Moda','Retalho Nobre','Ponto & Linha'],desc:'Equilibrado; cresce bem com marketing.'},
  tech:{nome:'Tecnologia',e:'💻',cor:'#5aa9ff',custo:4500,aluguel:100,base:420,sm:1.3,
    portes:['Assistência de celular','Assistência de celular','Software house','Software house','Big tech'],

const $ = id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pickW(ws){const t=ws.reduce((s,w)=>s+w,0);let r=Math.random()*t;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return i}return ws.length-1}
function fmt(n){const neg=n<0;n=Math.abs(n);let s;if(n>=1e9)s=(n/1e9).toFixed(2).replace('.',',')+' bi';else if(n>=1e6)s=(n/1e6).toFixed(2).replace('.',',')+' mi';else s=Math.round(n).toLocaleString('pt-BR');return (neg?'−':'')+'R$ '+s}
function stars(n){return '★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span>'}
function hash(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function txt(s){const c=S.companies[0];return s.replace(/\{n\}/g,S.ceo.name).replace(/\{e\}/g,c?c.name:'Sua empresa')}

/* ================== ECONOMIA ================== */
function hasEss(c){return c.emps.some(e=>e.cargo===0)&&c.emps.some(e=>e.cargo===1)}
function slots(c,i){if(i<2)return Math.min(c.lvl,3);if(i===2)return c.lvl>=2?Math.min(c.lvl-1,2):0;return c.lvl>=3?1:0}
function ramosDistintos(){return new Set(S.companies.map(c=>c.ramo)).size}
function globalMult(){let m=1;if(S.ceo.perfil==='vis')m*=1.15;m*=1+.02*(S.ceo.attr.vis-1);if(S.licoes.includes('cliente'))m*=1.05;if(S.licoes.includes('cesta'))m*=1+.05*Math.max(0,ramosDistintos()-1);return m}
function compMult(c){let m=1+.25*(c.lvl-1);if(!hasEss(c))m*=.4;if(c.emps.some(e=>e.cargo===3))m*=1.2;if(c.mkt>0)m*=1.3;m*=.8+S.rep/250;m*=globalMult();
  if((c.ramo==='alim'||c.ramo==='moda')&&S.companies.some(x=>x.ramo==='logi'))m*=1.1;
  for(const b of S.buffs)if(!b.cid||b.cid===c.id)m*=b.m;return m}
function empProd(c,e){const R=RAMOS[c.ramo];return R.base*R.cargos[e.cargo].p*(.6+.4*e.stars)*TRAITS[e.trait].prod*(.5+e.moral/200)}
function compRev(c){return c.emps.reduce((s,e)=>s+empProd(c,e),0)*compMult(c)}
function salMult(){let m=1;if(S.ceo.perfil==='neg')m*=.85;m*=1-.02*(S.ceo.attr.neg-1);if(S.licoes.includes('negocia'))m*=.95;return m}
function empSal(e){return e.sal*salMult()}
function rent(c){return RAMOS[c.ramo].aluguel*(1+.5*(c.lvl-1))}
function compCost(c){return c.emps.reduce((s,e)=>s+empSal(e),0)+rent(c)}
function totRev(){return S.companies.reduce((s,c)=>s+compRev(c),0)}
function totCost(){return S.companies.reduce((s,c)=>s+compCost(c),0)}
function compValue(c){let v=RAMOS[c.ramo].custo*.5;for(let l=1;l<c.lvl;l++)v+=lvlCost(c,l)*.5;return v}
function patrimonio(){return S.money+S.companies.reduce((s,c)=>s+compValue(c),0)}
function lvlCost(c,l=c.lvl){return Math.round(RAMOS[c.ramo].custo*1.2*Math.pow(l,1.5)/50)*50}
function mktCost(c){let k=Math.round(RAMOS[c.ramo].custo*.15*(1+.3*(c.lvl-1)));if(S.ceo.perfil==='com')k*=.75;k*=1-.03*(S.ceo.attr.car-1);return Math.round(k/10)*10}
function porte(c){return RAMOS[c.ramo].portes[c.lvl-1]}
function scaleK(){return Math.max(1,totRev()/900)}

/* ================== CANDIDATOS ================== */
function genCand(ramo,cargo){
  const b=S.hq*4+(S.ceo.attr.vis-1)*2;
  const w=[Math.max(5,35-b),35,20+b*.5,8+b*.35,2+b*.15];
  const st=pickW(w)+1;
  const tk=Object.keys(TRAITS);const tr=tk[pickW(tk.map(k=>TRAITS[k].w))];
  let sal=(30+25*st)*RAMOS[ramo].sm*TRAITS[tr].sal*rnd(.9,1.1);
  return {id:'e'+(S.uid++),name:pick(NOMES)+' '+pick(SOBRENOMES),cargo,stars:st,trait:tr,sal:Math.round(sal),moral:ri(62,85),low:0};
}
function getCands(c,cargo){
  const k=c.id+'_'+cargo;
  if(!S.cands[k]||!S.cands[k].length)S.cands[k]=[0,1,2].map(()=>genCand(c.ramo,cargo));
  let list=S.cands[k];
  if(S.flags.beto&&!S.flags.betoHired&&c===S.companies[0]&&cargo===1&&!list.some(x=>x.special)){
    list.unshift({id:'beto',name:'Beto "Turbo"',cargo:1,stars:2,trait:'leal',sal:Math.round(35*RAMOS[c.ramo].sm),moral:95,low:0,special:true});
  }
  return list;
}

function save(){if(!S||!S.started)return;S.lastSave=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(s)return JSON.parse(s)}catch(e){}return null}
setInterval(()=>{if(!document.hidden)save()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S&&S.started)offline()});

function offline(){
  const secs=Math.min(4*3600,(Date.now()-S.lastSave)/1000);
  if(secs<60||!S.companies.length){S.lastSave=Date.now();return}
  const g=totRev()/DAY*secs*.5;S.money+=g;S.earned+=g;S.lastSave=Date.now();
  const mins=Math.round(secs/60);
  showInfo('🌙','Enquanto você estava fora...',`Você ficou ${mins>=60?Math.floor(mins/60)+'h '+(mins%60)+'min':mins+' min'} longe. Suas empresas renderam <b class="gold">${fmt(g)}</b> (50% do normal, sem custos).`);
}

function hqArt(lv){

  g+=`<rect y="130" width="360" height="30" fill="#141a2a"/><rect y="130" width="360" height="2" fill="#2e3854"/>`;
  const win=(x,y,w,h,cols,rows,seed)=>{let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const on=hash(seed+'-'+r+'-'+c)%3!==0;s+=`<rect x="${x+c*(w/cols)+3}" y="${y+r*(h/rows)+3}" width="${w/cols-6}" height="${h/rows-6}" rx="1" fill="${on?'#e8b54d':'#26314d'}" opacity="${on?.85:1}"/>`}return s};

    g+=`<rect x="150" y="70" width="60" height="14" rx="3" fill="#e8b54d"/><text x="180" y="81" text-anchor="middle" font-size="10" font-weight="900" fill="#1d1406" font-family="system-ui">SEDE</text>`;
    g+=`<rect x="243" y="104" width="22" height="26" fill="#2a2f3e"/><circle cx="250" cy="96" r="4" fill="#ffd27a"/>`;
  }else{

    g+=`<rect x="${x}" y="${130-H}" width="${W}" height="${H}" fill="#2a3452"/><rect x="${x}" y="${130-H}" width="${W}" height="4" fill="#e8b54d"/>`;

function updateLive(){
  if(!S||!S.started)return;
  $('tMoney').textContent=fmt(S.money);$('tMoney').classList.toggle('neg',S.money<0);
  $('tDay').textContent='Dia '+S.day;$('tDayBar').style.width=(S.dayT*100)+'%';$('tRep').textContent='⭐ '+Math.round(S.rep);
  const r=totRev(),k=totCost();
  document.querySelectorAll('[data-live]').forEach(el=>{
    const [key,id]=el.dataset.live.split(':');let v;
    if(key==='rev')v=fmt(r);else if(key==='cost')v=fmt(k);
    else if(key==='prof'){v=fmt(r-k);el.className=r-k>=0?'green':'red'}
    else if(key==='patr')v=fmt(patrimonio());
    else if(key==='objp'){const C=CHAPTERS[S.chapter];if(C)el.style.width=C.prog()*100+'%';return}
    else if(key==='hqp'){const nx=HQS[S.hq+1];if(nx)el.style.width=clamp(patrimonio()/nx.min,0,1)*100+'%';return}
    else{const c=findCo(+id);if(!c)return;const cr=compRev(c),cc=compCost(c);
      if(key==='crev')v=fmt(cr);else if(key==='ccost')v=fmt(cc);else if(key==='cprof'){v=fmt(cr-cc);el.className=cr-cc>=0?'green':'red'}}
    el.textContent=v});
  $('dotCeo').style.display=S.ceo.pts>0?'block':'none';

/* ================== HISTÓRIA (player) ================== */
let storyOpen=false,evtOpen=false;
function playScene(key,cb,replay){
  const sc=SCENES[key];storyOpen=true;let i=0;let typing=null;let full='';
  $('story').classList.add('on');$('stTitle').textContent=sc.title||'';
  const end=(next)=>{clearInterval(typing);if(next){playScene(next,cb,replay);return}storyOpen=false;$('story').classList.remove('on');if(S.started){renderView()}cb&&cb()};
  const showLine=()=>{
    const L=sc.lines[i];const narr=L.w==='narr';
    const who=L.w==='ceo'?{n:S.ceo.name,l:Object.assign({bg:'#25304b'},S.ceo.look)}:NPC[L.w];
    $('stP').innerHTML=narr?'':avatar(who.l);$('stN').textContent=narr?'':who.n;
    $('stT').className='st-text'+(narr?' narr':'');
    full=txt(L.t);let n=0;$('stT').textContent='';$('stC').innerHTML='';$('stHint').style.display='none';
    clearInterval(typing);typing=setInterval(()=>{n+=2;$('stT').textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;done()}},18);
  };
  const done=()=>{const L=sc.lines[i];$('stT').textContent=full;
    if(L.choice&&!replay){$('stC').innerHTML=L.choice.map((c,j)=>`<button class="btn ${j?'sec':''}" data-j="${j}">${c.t}</button>`).join('');$('stC').querySelectorAll('button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();end(L.choice[+b.dataset.j].go)})}
    else $('stHint').style.display='block'};
  $('story').onclick=()=>{const L=sc.lines[i];
    if(typing){clearInterval(typing);typing=null;done();return}
    if(L.choice&&!replay)return;
    if(L.go&&!replay){end(L.go);return}
    i++;if(i>=sc.lines.length)end();else showLine()};
  $('stSkip').onclick=ev=>{ev.stopPropagation();
    const ci=sc.lines.findIndex(l=>l.choice);
    if(ci>=0&&!replay&&i<ci){i=ci;showLine();return}
    if(ci>=0&&!replay&&i===ci)return;
    const g=sc.lines[sc.lines.length-1].go;end(replay?null:g)};
  showLine();
}

function gainXP(x){const c=S.ceo;c.xp+=x;while(c.xp>=c.lvl*120){c.xp-=c.lvl*120;c.lvl++;c.pts++;toast(`🎖️ Você chegou ao nível ${c.lvl}! +1 ponto de atributo`,'good')}}
function addLicao(k){if(!S.licoes.includes(k))S.licoes.push(k)}

function completeChapter(){
  const n=S.chapter;gainXP(100);
  if(n===1){addLicao('cliente');S.chapter=2;S.flags.beto=true;playScene('ch2')}
  else if(n===2){S.chapter=3;playScene('ch3')}
  else if(n===3){addLicao('paga');S.chapter=4;playScene('ch4')}
  else if(n===4){addLicao('cesta');S.chapter=5;S.flags.vortexOn=true;playScene('ch5')}
  else if(n===5){playScene('final1',()=>{if(S.chapter===5){addLicao('negocia');S.chapter=6;S.flags.ato1=true;save();renderView()}})}
  save();
}

  {id:'pai',once:true,cond:()=>S.chapter>=3,make:()=>({npc:'antonio',tag:'Família',t:'Visita do seu pai',x:'Seu Antônio aparece antes do turno da noite, com uma garrafa térmica de café. "Só vim ver como tá a firma."',
    o:[{t:'Mostrar os números',h:'+XP',f:()=>{gainXP(60);return '"Esse é o lucro de um dia? O meu era de uma semana." Ele ri e enxuga o olho disfarçando.'}},
       {t:'Pedir um conselho',h:'+10 moral para todos',f:()=>{allEmps().forEach(([c,e])=>e.moral=clamp(e.moral+10,0,100));return '"Chama a turma pelo nome e paga em dia. O resto se ajeita." Você repete isso pra equipe no dia seguinte.'}}]})},
  {id:'vortex',cond:()=>S.flags.vortexOn&&allEmps().some(([c,e])=>!e.special&&e.trait!=='leal'&&(e.moral<60||e.trait==='ambicioso')),make:()=>{
    const [c,e]=pick(allEmps().filter(([c,e])=>!e.special&&e.trait!=='leal'&&(e.moral<60||e.trait==='ambicioso')));const f=e.name.split(' ')[0];
    return {npc:'otavio',tag:'Rival',t:'A Vortex quer seu funcionário',x:`${esc(e.name)} recebeu uma proposta da Vortex: 40% a mais de salário. ${f} veio te avisar antes de responder.`,
    o:[{t:'Cobrir a oferta',h:'+30% salário · moral sobe',f:()=>{e.sal=Math.round(e.sal*1.3);e.moral=clamp(e.moral+15,0,100);return `${f} fica. Otávio vai ter que tentar de novo.`}},
       {t:'Conversar e convencer',h:`Teste de Liderança (${S.ceo.attr.lid}/10)`,f:()=>{const ch=.3+.07*S.ceo.attr.lid+(S.ceo.perfil==='lid'?.1:0);if(Math.random()<ch){e.moral=clamp(e.moral+10,0,100);return `"Eu acredito no que a gente tá construindo aqui." ${f} recusa a Vortex.`}c.emps=c.emps.filter(x=>x!==e);return `${f} agradece a conversa... e aceita a proposta. A Vortex levou mais um.`}},
       {t:'Deixar ir',h:'Perde o funcionário',f:()=>{c.emps=c.emps.filter(x=>x!==e);return `${f} vai para a Vortex. A vaga fica aberta.`}}]}}}
];
function maybeEvent(){
  if(S.chapter<2||storyOpen||evtOpen)return;
  if(Math.random()>.42)return;
  const pool=EVENTS.filter(ev=>!(ev.once&&S.seen[ev.id])&&ev.cond()&&S.lastEvt!==ev.id);
  if(!pool.length)return;
  const ev=pick(pool.flatMap(e=>e.id==='vortex'?[e,e]:[e]));S.seen[ev.id]=1;S.lastEvt=ev.id;showEvent(ev.make());
}
function showEvent(E){
  evtOpen=true;
  const ic=E.npc?avatar(NPC[E.npc].l):E.who?avatar(E.who):E.ic;
  $('evtCard').innerHTML=`<div class="evt-ic">${ic}</div><div class="evt-tag">${E.tag}</div><h3>${E.t}</h3><p>${E.x}</p>${E.o.map((o,i)=>`<button class="opt" data-o="${i}"><b>${o.t}</b><small>${o.h}</small></button>`).join('')}`;
  $('evt').classList.add('on');
  $('evtCard').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const r=E.o[+b.dataset.o].f();S.legado=clamp(S.legado,-100,100);save();
    $('evtCard').innerHTML=`<div class="evt-ic">${ic}</div><div class="evt-tag">${E.tag}</div><h3>${E.t}</h3><p>${r}</p><button class="btn" id="eOk">Continuar</button>`;
    $('eOk').onclick=()=>{$('evt').classList.remove('on');evtOpen=false;if(sheetStack.length)renderSheet();renderView()}});
}

/* ================== DIA ================== */
function endDay(){
  const rev=S.todayRev,cost=totCost();
  S.money-=cost;S.day++;S.dayT=0;S.todayRev=0;
  const decayMul=S.licoes.includes('paga')?.5:1;
  const quits=[];
  S.companies.forEach(c=>{
    const loss=compRev(c)<compCost(c);const fof=c.emps.filter(e=>e.trait==='fofoqueiro');
    c.emps.forEach(e=>{
      let d=-3+(S.money>=0?2:-8)+(S.ceo.attr.lid-1)*.5+(S.ceo.perfil==='lid'?2:0);
      if(loss)d-=2;d-=3*fof.filter(f=>f!==e).length;
      if(d<0){d*=decayMul;if(e.trait==='leal')d*=.5}
      e.moral=clamp(e.moral+d,0,100);
      if(e.moral<15){e.low=(e.low||0)+1}else e.low=0;
      if(e.low>=2&&!e.special)quits.push([c,e]);
    });
    if(c.mkt>0){c.mkt--;S.rep=clamp(S.rep+1+S.ceo.attr.car*.2,0,100)}
  });
  quits.forEach(([c,e])=>{c.emps=c.emps.filter(x=>x!==e);toast(`😞 ${esc(e.name)} pediu demissão da ${esc(c.name)} (moral baixa)`,'bad')});
  S.buffs.forEach(b=>b.d--);S.buffs=S.buffs.filter(b=>b.d>0);
  // reputação volta devagar para 30 quando muito alta sem marketing
  if(S.rep>60&&!S.companies.some(c=>c.mkt>0))S.rep-=.3;
  gainXP(10);
  // sede
  while(S.hq<HQS.length-1&&patrimonio()>=HQS[S.hq+1].min&&(S.hq+1!==1||S.chapter>=5)){S.hq++;toast(`🏢 Nova sede: ${HQS[S.hq].n}! Agora cabem ${HQS[S.hq].max} empresas.`,'good')}
  if(S.companies.length)toast(`📅 Dia ${S.day-1} · Receita <b class="green">${fmt(rev)}</b> · Custos <b class="red">${fmt(cost)}</b> · Lucro <b class="${rev-cost>=0?'green':'red'}">${fmt(rev-cost)}</b>`);
  // falência
  if(S.money<0){S.debt++;if(S.debt<3)toast(`⚠ Caixa negativo (${S.debt}/3). Corte custos!`,'bad')}else S.debt=0;
  if(S.debt>=3){S.debt=0;if(!S.flags.cida){S.flags.cida=1;S.money+=2000;playScene('falencia1')}else{S.flags.marcos=(S.flags.marcos||0)+1;S.money+=3000;playScene('falencia2')}}
  else maybeEvent();
  save();
  if(tab==='ceo'||tab==='story')renderView();
}

/* ================== LOOP ================== */
let last=performance.now(),acc=0,acc2=0;
function loop(now){
  const dt=Math.min(1,(now-last)/1000);last=now;
  if(S&&S.started&&!storyOpen&&!evtOpen){
    const rps=totRev()/DAY;S.money+=rps*dt;S.todayRev+=rps*dt;S.earned+=rps*dt;
    S.dayT+=dt/DAY;if(S.dayT>=1)endDay();
    if(S.chapter>=1&&S.chapter<=5&&CHAPTERS[S.chapter].check())completeChapter();
  }
  acc+=dt;if(acc>.25){acc=0;updateLive()}
  acc2+=dt;if(acc2>3){acc2=0;if(sheetStack.length&&!storyOpen&&!evtOpen&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))renderSheet()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================== INÍCIO ================== */
let homeDone=false;function goHome(){if(homeDone)return;homeDone=true;show('home');initHome()}
setTimeout(goHome,2700);
$('splash').onclick=goHome;
window.__ceo={get S(){return S},endDay,completeChapter};
</script>
