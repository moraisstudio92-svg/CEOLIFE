<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>CEO: Do Zero ao Império</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CEO">
<style>
:root{--bg:#0b0f1a;--bg2:#10172a;--card:#161e33;--card2:#1f2944;--line:#2a3552;--tx:#eef1f7;--mu:#8d97ad;--gold:#e8b54d;--gold2:#ffd27a;--green:#45d38a;--red:#ff6b6b;--blue:#5aa9ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070d;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1d1406;font-weight:800;font-size:16px;letter-spacing:.2px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--tx);font-weight:700}
.btn.red{background:#3a1d24;color:var(--red)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.sm{padding:11px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.mu{color:var(--mu)}
.gold{color:var(--gold2)}
.green{color:var(--green)}
.red{color:var(--red)}
small{font-size:12px}

/* SPLASH */
#splash{align-items:center;justify-content:center;background:#000}
.splash-in{text-align:center;opacity:0;animation:fadeio 2.6s ease forwards}
.logo-m{width:84px;height:84px;margin:0 auto 14px;border:3px solid var(--gold);border-radius:22px;display:grid;place-items:center;font-size:46px;font-weight:900;color:var(--gold)}
.logo-t{font-size:22px;font-weight:900;letter-spacing:6px}
.logo-s{font-size:12px;letter-spacing:8px;color:var(--gold);margin-top:6px}
@keyframes fadeio{0%{opacity:0;transform:scale(.96)}25%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}

/* HOME */
#home{justify-content:flex-end;background:radial-gradient(120% 70% at 50% 10%,#1b2747 0%,#0b0f1a 60%)}
.skyline{position:absolute;left:0;right:0;bottom:38%;height:240px}
.home-c{position:relative;padding:28px 24px calc(28px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin-bottom:24px}
.brand small{letter-spacing:3px;color:var(--mu);font-size:11px}
.brand h1{font-size:68px;font-weight:900;letter-spacing:6px;line-height:1;margin-top:8px;background:linear-gradient(180deg,#fff2c8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h2{font-size:17px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#cfd6e6;margin-top:6px}
.home-btns{display:grid;gap:10px}
.update{margin-top:16px;text-align:center;font-size:13px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.update b{color:var(--gold2)}

/* CREATE */
#create{background:var(--bg)}
.cr-body{flex:1;overflow-y:auto;padding:22px 20px 12px}
.cr-body h2{font-size:24px;margin-bottom:4px}
.cr-prev{display:flex;justify-content:center;margin:16px 0}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.inp{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;outline:none}
.inp:focus{border-color:var(--gold)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--gold2)}
.sw.txt button{width:auto;height:auto;border-radius:10px;padding:8px 12px;background:var(--card);border:2px solid var(--line);font-size:14px}
.sw.txt button.on{border-color:var(--gold)}
.perfis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perfil{text-align:left;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.perfil.on{border-color:var(--gold);background:#231f17}
.perfil b{display:block;font-size:15px;margin-bottom:3px}
.perfil span{font-size:12px;color:var(--mu)}
.cr-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* GAME */
#game{background:var(--bg)}
.top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#141c31,#0f1527);border-bottom:1px solid var(--line)}
.top-row{display:flex;justify-content:space-between;align-items:center}
.me{display:flex;align-items:center;gap:10px}
.me .av{width:40px;height:40px}
.me b{font-size:15px;display:block}
.me small{color:var(--mu)}
.cash{text-align:right}
.cash small{display:block;color:var(--mu);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.cash b{font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
.cash b.neg{color:var(--red)}
.top-row2{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px}
.daybar{flex:1;height:6px;background:#26304a;border-radius:4px;overflow:hidden}
.daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px}
.chip{padding:3px 9px;border-radius:20px;background:var(--card2);font-size:12px;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:14px 14px 20px}
.tabs{display:flex;border-top:1px solid var(--line);background:#0e1424;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 10px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--gold2)}
.tabs button.on i{filter:none;opacity:1}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:10px;font-weight:700}
.hq{padding:0;overflow:hidden}
.hq svg{display:block;width:100%;height:auto}
.hq-info{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.hq-info b{font-size:17px}
.obj{border-color:#5a4520;background:linear-gradient(180deg,#221c12,#18150f)}
.obj .cap{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:800}
.obj .tt{font-size:18px;font-weight:800;margin:4px 0 6px}
.prog{height:8px;background:#34291a;border-radius:6px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.fin div{background:var(--bg2);border-radius:12px;padding:10px 4px}
.fin small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
.fin b{font-size:15px;font-variant-numeric:tabular-nums}
.co{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.co-ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.co-m{flex:1;min-width:0}
.co-m b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-m small{color:var(--mu)}
.co-r{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.co-r small{display:block;color:var(--mu);font-size:11px}
.warn{font-size:12px;color:#ffb35c;margin-top:4px}
.empty{text-align:center;color:var(--mu);padding:22px 10px;font-size:14px}

/* SHEET */
.sheet{position:absolute;inset:0;z-index:30;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(3,5,10,.6)}
.sheet-p{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sh-head h2{flex:1;font-size:19px}
.sh-x{width:36px;height:36px;border-radius:50%;background:var(--card2);font-size:16px}
.sh-body{overflow-y:auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom))}
.ramos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ramo{padding:14px 12px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-align:left;position:relative}
.ramo.on{border-color:var(--gold);background:#221d14}
.ramo .e{font-size:30px}
.ramo b{display:block;font-size:15px;margin-top:6px}
.ramo small{color:var(--mu)}
.ramo.lock{opacity:.45}
.ramo .lk{position:absolute;top:10px;right:10px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.kv>:last-child{text-align:right}
.kv:last-child{border:0}
.cg{margin-bottom:14px}
.cg-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.ess{font-size:10px;letter-spacing:1px;padding:2px 6px;border-radius:6px;background:#3a2c14;color:var(--gold2);text-transform:uppercase}
.slot{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.slot.free{border-style:dashed;justify-content:center;color:var(--gold2);font-weight:700;padding:14px}
.slot .av{width:44px;height:44px;flex-shrink:0}
.slot .m{flex:1;min-width:0}
.slot .m b{font-size:15px;display:block}
.st{color:var(--gold2);letter-spacing:1px;font-size:13px}
.tr{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;background:var(--card2);margin-left:4px}
.mbar{height:5px;background:#2b3450;border-radius:4px;overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:4px}
.cand{display:block;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.cand.on{border-color:var(--gold);background:#211c13}
.cand .top2{display:flex;gap:12px;align-items:center}
.cand .av{width:52px;height:52px}
.cand .det{margin-top:10px;font-size:13px;color:#cfd6e6;display:none}
.cand.on .det{display:block}
.lockc{padding:12px;border-radius:14px;border:1px dashed var(--line);color:var(--mu);font-size:13px;margin-bottom:8px;text-align:center}
.acts{display:grid;gap:8px;margin-top:6px}

/* TOASTS */
#toasts{position:absolute;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top));z-index:40;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.toast{background:rgba(22,30,51,.97);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;animation:tin .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* STORY */
.overlay{position:absolute;inset:0;z-index:50;display:none}
.overlay.on{display:block}
#story{background:radial-gradient(120% 80% at 50% 20%,#25314f 0%,#0a0e18 70%)}
.st-portrait{position:absolute;left:0;right:0;bottom:240px;display:flex;justify-content:center;transition:opacity .25s}
.st-portrait .av{width:220px;height:220px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.st-box{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:200px;background:rgba(13,18,32,.96);border:1px solid #3a4666;border-radius:20px;padding:30px 18px 18px}
.st-name{position:absolute;top:-15px;left:18px;background:var(--gold);color:#1d1406;font-weight:900;padding:5px 14px;border-radius:10px;font-size:14px;letter-spacing:.5px}
.st-name:empty{display:none}
.st-text{font-size:17px;line-height:1.5;min-height:100px}
.st-text.narr{font-style:italic;color:#cfd6e6;text-align:center;padding-top:8px}
.st-hint{position:absolute;right:16px;bottom:10px;font-size:11px;color:var(--mu);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.st-choices{display:grid;gap:8px;margin-top:12px}
.st-skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;color:var(--mu)}
.st-title{position:absolute;top:calc(60px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:800}

/* EVENT */
#evt{background:rgba(3,5,10,.75);display:none;align-items:center;justify-content:center;padding:20px}
#evt.on{display:flex}
.evt-card{width:100%;max-width:420px;background:linear-gradient(180deg,#1d2640,#141b2e);border:1px solid #3a4666;border-radius:22px;padding:22px 18px 18px;text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.evt-ic{font-size:44px;display:flex;justify-content:center}
.evt-ic .av{width:96px;height:96px}
.evt-tag{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-weight:800;margin-top:8px}
.evt-card h3{font-size:21px;margin:6px 0 8px}
.evt-card p{font-size:15px;line-height:1.5;color:#d4dbea;margin-bottom:16px}
.opt{display:block;width:100%;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.opt b{display:block;font-size:15px}
.opt small{color:var(--mu)}
.opt:active{border-color:var(--gold)}

.ceo-h{display:flex;gap:14px;align-items:center}
.ceo-h .av{width:84px;height:84px}
.attr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border:0}
.attr .n{flex:1}
.attr .n small{display:block;color:var(--mu)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:14px;border-radius:2px;background:#2b3450}
.pips i.f{background:var(--gold)}
.plus{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#1d1406;font-weight:900;font-size:18px}
.leg{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#ff6b6b,#3a4666 50%,#45d38a);margin:10px 0 6px}
.leg i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:#fff;transform:translateX(-3px)}
.chap{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.chap:last-child{border:0}
.chap .s{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--card2);flex-shrink:0}
.chap .s.ok{background:#1f3a2c;color:var(--green)}
.chap .s.cur{background:var(--gold);color:#1d1406}
.chap .m{flex:1}
.chap .m small{color:var(--mu);display:block}
.licao{padding:10px 12px;border-radius:12px;background:#201b12;border:1px solid #4a3a1c;margin-bottom:8px;font-size:14px}
.licao i{color:#e9dcc0}
.licao small{display:block;color:var(--gold2);margin-top:4px}

/* AO VIVO */
.prev{display:block;width:100%;aspect-ratio:16/10;border-radius:14px;background:#0e1424;cursor:zoom-in;touch-action:manipulation}
.prev.sm{aspect-ratio:16/9;margin-bottom:12px}
.live-card{padding:10px}
.live-h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;font-weight:800;color:#ff7b7b;margin:2px 4px 8px}
.rec{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite;flex-shrink:0}
.lchips,.lv-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.lchips{margin-top:8px}
.lchips::-webkit-scrollbar,.lv-chips::-webkit-scrollbar{display:none}
.lchips button,.lv-chips button{flex-shrink:0;padding:7px 11px;border-radius:20px;background:var(--card2);font-size:12px;white-space:nowrap;border:1px solid var(--line)}
.lchips button.on,.lv-chips button.on{background:var(--gold);color:#1d1406;font-weight:800;border-color:var(--gold)}
#live{background:#0b0f1a;z-index:45}
#liveCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.lv-top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 18px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(8,11,20,.9),rgba(8,11,20,0));pointer-events:none}
.lv-top>*{pointer-events:auto}
.lv-top button{width:40px;height:40px;border-radius:50%;background:rgba(20,26,44,.9);font-size:16px;border:1px solid var(--line);flex-shrink:0}
.lv-t{flex:1;min-width:0}.lv-t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv-t small{color:#c5cbe0;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-cash{font-weight:900;color:var(--gold2);font-size:17px;font-variant-numeric:tabular-nums}
.lv-chips{position:absolute;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top))}
.lv-zoom{position:absolute;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));display:grid;gap:8px}
.lv-zoom button{width:48px;height:48px;border-radius:14px;background:rgba(20,26,44,.92);font-size:24px;font-weight:800;border:1px solid var(--line)}
.lv-hint{position:absolute;left:12px;right:72px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:#c5cbe0;background:rgba(8,11,20,.65);padding:8px 10px;border-radius:10px;pointer-events:none}
.sheet{z-index:46}
#toasts{z-index:48}
.hero{display:flex;justify-content:center;margin-bottom:-8px}
.hero svg{width:min(92%,380px);height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.mbtn{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;background:rgba(20,26,44,.85);font-size:18px;z-index:3;border:1px solid var(--line)}
.chip.snd{border:0;color:var(--tx)}
#updBar{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:60;display:none;align-items:center;gap:10px;background:linear-gradient(180deg,#2a2112,#1d170c);border:1px solid var(--gold);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s ease}
#updBar.on{display:flex}
#updBar .tx{flex:1;font-size:14px}#updBar .tx small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
#updBar button{padding:9px 12px;border-radius:10px;background:var(--gold);color:#1d1406;font-weight:800;font-size:13px}
.mode{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.mode .e{font-size:32px}.mode b{display:block;font-size:17px;margin-bottom:3px}.mode small{color:var(--mu);font-size:13px;line-height:1.35}
.mode:disabled{opacity:.4}
.bairros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bairros button{padding:9px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:14px}
.bairros button.on{border-color:var(--gold);background:#221d14}

#game{background:#0b0f1a}

.hud-top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none;z-index:5}
.hud-top>*{pointer-events:auto}
.glass,.hud-me,.hud-cash,.pill,.hud-chips button,.hud-obj,.hud-zoom button,.hud-bot{background:rgba(10,14,28,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hud-me{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:30px;text-align:left}
.hud-me .av{width:34px;height:34px}.hud-me b{display:block;font-size:13px;line-height:1.1}.hud-me small{font-size:10px;color:#c5cbe0}
.hud-cash{padding:6px 12px;border-radius:16px;text-align:right}
.hud-cash b{display:block;font-size:20px;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1.1}
.hud-cash b.neg{color:var(--red)}
.hud-cash small{font-size:11px;font-weight:700}
.hud-row2{display:flex;gap:6px;margin-top:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}

.pill{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;color:#eef1f7}
.pill.ok{background:rgba(47,154,90,.75)}.pill.off{background:rgba(201,71,63,.75)}

.hud-chips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.hud-chips::-webkit-scrollbar{display:none}
.hud-chips button{flex-shrink:0;padding:7px 11px;border-radius:20px;font-size:12px;white-space:nowrap}
.hud-chips button.on{background:rgba(232,181,77,.92);color:#1d1406;font-weight:800;border-color:var(--gold)}
.hud-chips button.add{background:rgba(47,154,90,.8);font-weight:800}
.pulse{animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 6px rgba(47,154,90,.25)}}
.hud-obj{display:block;margin-top:6px;padding:7px 12px;border-radius:14px;font-size:12px;text-align:left;max-width:78%;color:#eef1f7}
.hud-obj span{display:block;font-weight:700}
.hud-obj i{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden}
.hud-obj i b{display:block;height:100%;background:var(--gold);width:0}
.hud-zoom{position:absolute;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));display:grid;gap:8px;z-index:5}
.hud-zoom button{width:42px;height:42px;border-radius:14px;font-size:22px;font-weight:800;color:#eef1f7}
.hud-bot{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;border-radius:20px;z-index:5;padding:4px}
.hud-bot button{flex:1;padding:6px 0 7px;font-size:10.5px;color:#e6eaf4;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-weight:600;border-radius:14px}
.hud-bot button:active{background:rgba(255,255,255,.12)}
.hud-bot button i{font-style:normal;font-size:21px}
.hud-bot .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.sheet-bg{background:rgba(3,5,10,.28)!important}
.sheet-p{background:rgba(16,22,40,.9)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);max-height:74%!important}

.toast{padding:8px 11px;font-size:12.5px}

.pips.sm i{width:14px;height:6px}
.deco{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line);margin-bottom:8px}

.seg button.on{background:var(--gold);color:#1d1406}

/* ================== UTIL ================== */
const $ = id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pickW(ws){const t=ws.reduce((s,w)=>s+w,0);let r=Math.random()*t;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return i}return ws.length-1}
function fmt(n){const neg=n<0;n=Math.abs(n);let s;if(n>=1e9)s=(n/1e9).toFixed(2).replace('.',',')+' bi';else if(n>=1e6)s=(n/1e6).toFixed(2).replace('.',',')+' mi';else s=Math.round(n).toLocaleString('pt-BR');return (neg?'−':'')+'R$ '+s}
function stars(n){return '★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span>'}
function hash(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function txt(s){const c=S.companies[0];return s.replace(/\{n\}/g,S.ceo.name).replace(/\{e\}/g,c?c.name:'Sua empresa')}

function empLook(e){const h=hash(e.id+e.name);const styles=['short','long','slick','bun','bald','short','long'];return {skin:SKINS[h%4],hair:HAIRC[(h>>>3)%4],style:styles[(h>>>5)%styles.length],outfit:['#2b3a67','#7a2e3b','#2f6b55','#5b4a7a','#6b5a2b','#2b5f6b'][(h>>>8)%6],acc:((h>>>11)%7===0)?'glasses':'',bg:'#222c45'}}

/* ================== ECONOMIA ================== */
function hasEss(c){return c.emps.some(e=>e.cargo===0)&&c.emps.some(e=>e.cargo===1)}
function slots(c,i){if(i<2)return Math.min(c.lvl,3);if(i===2)return c.lvl>=2?Math.min(c.lvl-1,2):0;return c.lvl>=3?1:0}
function brandOf(c){return c.brand||c.id}
function unitsOf(c){return S.companies.filter(x=>brandOf(x)===brandOf(c))}
function unitLabel(c){return c.unit?c.unit:(unitsOf(c).length>1?'Matriz':'')}
function ramosDistintos(){return new Set(S.companies.map(c=>c.ramo)).size}
function globalMult(){let m=1;if(S.ceo.perfil==='vis')m*=1.15;m*=1+.02*(S.ceo.attr.vis-1);if(S.licoes.includes('cliente'))m*=1.05;if(S.licoes.includes('cesta'))m*=1+.05*Math.max(0,ramosDistintos()-1);return m}
function compMult(c){let m=1+.25*(c.lvl-1);if(!hasEss(c))m*=.4;if(c.emps.some(e=>e.cargo===3))m*=1.2;if(c.mkt>0)m*=1.3;m*=.8+S.rep/250;m*=globalMult();
  if((c.ramo==='alim'||c.ramo==='moda')&&S.companies.some(x=>x.ramo==='logi'))m*=1.1;
  for(const b of S.buffs)if(!b.cid||b.cid===c.id)m*=b.m;m*=1+.05*(unitsOf(c).length-1);m*=1+.04*decoTotal(c);m*=1+(eLvl(c,'estac')*6+eLvl(c,'calcada')*3)/100;return m}
function empProd(c,e){const R=RAMOS[c.ramo];return R.base*R.cargos[e.cargo].p*(.6+.4*e.stars)*TRAITS[e.trait].prod*(.5+e.moral/200)}
function stLvl(c,key){return (c.sl&&c.sl[key])||1}
function stMult(c,key){return 1+.2*(stLvl(c,key)-1)}
function stCost(c,key){return Math.round(RAMOS[c.ramo].custo*.22*Math.pow(1.7,stLvl(c,key)-1)/10)*10}
function compRev(c){let s=0;for(let i=0;i<4;i++){{const wk=ROOMK[c.ramo][i]==='walker'?1+.1*eLvl(c,'beco'):1;c.emps.filter(e=>e.cargo===i).forEach((e,k)=>{s+=empProd(c,e)*stMult(c,i+'_'+k)*wk})}}return s*compMult(c)}
function compRevDay(c){return compRev(c)*openLen(c)/12}
function salMult(){let m=1;if(S.ceo.perfil==='neg')m*=.85;m*=1-.02*(S.ceo.attr.neg-1);if(S.licoes.includes('negocia'))m*=.95;return m}
function empSal(e){return e.sal*salMult()}
function rent(c){return RAMOS[c.ramo].aluguel*(1+.5*(c.lvl-1))}
function compCost(c){return c.emps.reduce((s,e)=>s+empSal(e),0)+rent(c)}
function totRev(){return S.companies.reduce((s,c)=>s+compRevDay(c),0)}
function totCost(){return S.companies.reduce((s,c)=>s+compCost(c),0)}
function compValue(c){let v=(c.brand?filCost(c.ramo):RAMOS[c.ramo].custo)*.5;for(let l=1;l<c.lvl;l++)v+=lvlCost(c,l)*.5;return v}
function patrimonio(){return S.money+S.companies.reduce((s,c)=>s+compValue(c),0)}
function lvlCost(c,l=c.lvl){return Math.round(RAMOS[c.ramo].custo*1.2*Math.pow(l,1.5)/50)*50}
function mktCost(c){let k=Math.round(RAMOS[c.ramo].custo*.15*(1+.3*(c.lvl-1)));if(S.ceo.perfil==='com')k*=.75;k*=1-.03*(S.ceo.attr.car-1);return Math.round(k/10)*10}
function filCost(r){return Math.round(RAMOS[r].custo*.8/50)*50}
function porte(c){return RAMOS[c.ramo].portes[c.lvl-1]}
function scaleK(){return Math.max(1,totRev()/900)}

/* ================== CANDIDATOS ================== */
function genCand(ramo,cargo){
  const b=S.hq*4+(S.ceo.attr.vis-1)*2;
  const w=[Math.max(5,35-b),35,20+b*.5,8+b*.35,2+b*.15];
  const st=pickW(w)+1;
  const tk=Object.keys(TRAITS);const tr=tk[pickW(tk.map(k=>TRAITS[k].w))];
  let sal=(30+25*st)*RAMOS[ramo].sm*TRAITS[tr].sal*rnd(.9,1.1);
  return {id:'e'+(S.uid++),name:pick(NOMES)+' '+pick(SOBRENOMES),cargo,stars:st,trait:tr,sal:Math.round(sal),moral:ri(62,85),low:0};
}
function getCands(c,cargo){
  const k=c.id+'_'+cargo;
  if(!S.cands[k]||!S.cands[k].length)S.cands[k]=[0,1,2].map(()=>genCand(c.ramo,cargo));
  let list=S.cands[k];
  if(S.flags.beto&&!S.flags.betoHired&&c===S.companies[0]&&cargo===1&&!list.some(x=>x.special)){
    list.unshift({id:'beto',name:'Beto "Turbo"',cargo:1,stars:2,trait:'leal',sal:Math.round(35*RAMOS[c.ramo].sm),moral:95,low:0,special:true});
  }
  return list;
}

function save(){if(!S||!S.started)return;S.lastSave=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(s)return JSON.parse(s)}catch(e){}return null}
setInterval(()=>{if(!document.hidden)save()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S&&S.started)offline()});

function offline(){
  const secs=Math.min(4*3600,(Date.now()-S.lastSave)/1000);
  if(secs<60||!S.companies.length){S.lastSave=Date.now();return}
  const g=totRev()/DAY*secs*.5;S.money+=g;S.earned+=g;S.lastSave=Date.now();
  const mins=Math.round(secs/60);
  showInfo('🌙','Enquanto você estava fora...',`Você ficou ${mins>=60?Math.floor(mins/60)+'h '+(mins%60)+'min':mins+' min'} longe. Suas empresas renderam <b class="gold">${fmt(g)}</b> (50% do normal, sem custos).`);
}

function skyline(){
  let g='';const cols=['#141c33','#18213b','#111829'];let x=0;let i=0;
  while(x<480){const w=ri(34,70),h=ri(70,220);const c=cols[i%3];g+=`<rect x="${x}" y="${240-h}" width="${w}" height="${h}" fill="${c}"/>`;
    for(let yy=240-h+10;yy<232;yy+=14)for(let xx=x+6;xx<x+w-6;xx+=10)if(Math.random()<.22)g+=`<rect x="${xx}" y="${yy}" width="4" height="6" fill="#e8b54d" opacity="${rnd(.3,.9).toFixed(2)}"/>`;
    x+=w+ri(0,6);i++}
  $('skyline').innerHTML=g;
}

  $('crBody').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{c.name=$('crName').value;l[b.dataset.k]=b.dataset.v;renderCreate()});
  $('crBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{c.name=$('crName').value;c.perfil=b.dataset.p;renderCreate()});

function hqArt(lv){
  let g=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2848"/><stop offset="1" stop-color="#2d2a3d"/></linearGradient></defs><rect width="360" height="160" fill="url(#sky)"/>`;
  g+=`<circle cx="310" cy="34" r="12" fill="#f3e3b5" opacity=".85"/>`;
  for(let i=0;i<9;i++){const h=20+((i*37)%50);g+=`<rect x="${i*42}" y="${130-h}" width="34" height="${h}" fill="#151d33"/>`}
  g+=`<rect y="130" width="360" height="30" fill="#141a2a"/><rect y="130" width="360" height="2" fill="#2e3854"/>`;
  const win=(x,y,w,h,cols,rows,seed)=>{let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const on=hash(seed+'-'+r+'-'+c)%3!==0;s+=`<rect x="${x+c*(w/cols)+3}" y="${y+r*(h/rows)+3}" width="${w/cols-6}" height="${h/rows-6}" rx="1" fill="${on?'#e8b54d':'#26314d'}" opacity="${on?.85:1}"/>`}return s};
  if(lv===0){
    g+=`<path d="M120 130 V82 L180 52 L240 82 V130Z" fill="#3a3348"/><path d="M112 84 L180 46 L248 84" stroke="#5a4e6a" stroke-width="8" fill="none" stroke-linejoin="round"/>`;
    g+=`<rect x="140" y="88" width="80" height="42" fill="#7b7f8c"/>`;for(let y=92;y<130;y+=7)g+=`<rect x="140" y="${y}" width="80" height="2" fill="#5f6370"/>`;
    g+=`<rect x="150" y="70" width="60" height="14" rx="3" fill="#e8b54d"/><text x="180" y="81" text-anchor="middle" font-size="10" font-weight="900" fill="#1d1406" font-family="system-ui">SEDE</text>`;
    g+=`<rect x="243" y="104" width="22" height="26" fill="#2a2f3e"/><circle cx="250" cy="96" r="4" fill="#ffd27a"/>`;
  }else{
    const H=[0,60,82,104,124][lv],W=[0,110,120,90,64][lv],x=180-W/2;
    g+=`<rect x="${x}" y="${130-H}" width="${W}" height="${H}" fill="#2a3452"/><rect x="${x}" y="${130-H}" width="${W}" height="4" fill="#e8b54d"/>`;
    g+=win(x+6,130-H+8,W-12,H-16,lv>=3?4:5,Math.round(H/14),'hq'+lv);
    if(lv>=3)g+=`<rect x="${x+W/2-14}" y="${130-H-14}" width="28" height="14" fill="#2a3452"/><circle cx="${x+W/2}" cy="${130-H-20}" r="3" fill="#ff6b6b"/>`;
    if(lv===4)g+=`<path d="M${x+W/2} ${130-H-40} V${130-H-14}" stroke="#8d97ad" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 360 160">${g}</svg>`;
}

/* ================== HISTÓRIA (player) ================== */
let storyOpen=false,evtOpen=false;
function playScene(key,cb,replay){
  const sc=SCENES[key];storyOpen=true;let i=0;let typing=null;let full='';
  $('story').classList.add('on');$('stTitle').textContent=sc.title||'';
  const end=(next)=>{clearInterval(typing);if(next){playScene(next,cb,replay);return}storyOpen=false;$('story').classList.remove('on');if(S.started){renderView()}cb&&cb()};
  const showLine=()=>{
    const L=sc.lines[i];const narr=L.w==='narr';
    const who=L.w==='ceo'?{n:S.ceo.name,l:Object.assign({bg:'#25304b'},S.ceo.look)}:NPC[L.w];
    $('stP').innerHTML=narr?'':avatar(who.l);$('stN').textContent=narr?'':who.n;
    $('stT').className='st-text'+(narr?' narr':'');
    full=txt(L.t);let n=0;$('stT').textContent='';$('stC').innerHTML='';$('stHint').style.display='none';
    clearInterval(typing);typing=setInterval(()=>{n+=2;$('stT').textContent=full.slice(0,n);if(n>=full.length){clearInterval(typing);typing=null;done()}},18);
  };
  const done=()=>{const L=sc.lines[i];$('stT').textContent=full;
    if(L.choice&&!replay){$('stC').innerHTML=L.choice.map((c,j)=>`<button class="btn ${j?'sec':''}" data-j="${j}">${c.t}</button>`).join('');$('stC').querySelectorAll('button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();end(L.choice[+b.dataset.j].go)})}
    else $('stHint').style.display='block'};
  $('story').onclick=()=>{const L=sc.lines[i];
    if(typing){clearInterval(typing);typing=null;done();return}
    if(L.choice&&!replay)return;
    if(L.go&&!replay){end(L.go);return}
    i++;if(i>=sc.lines.length)end();else showLine()};
  $('stSkip').onclick=ev=>{ev.stopPropagation();
    const ci=sc.lines.findIndex(l=>l.choice);
    if(ci>=0&&!replay&&i<ci){i=ci;showLine();return}
    if(ci>=0&&!replay&&i===ci)return;
    const g=sc.lines[sc.lines.length-1].go;end(replay?null:g)};
  showLine();
}

function gainXP(x){const c=S.ceo;c.xp+=x;while(c.xp>=c.lvl*120){c.xp-=c.lvl*120;c.lvl++;c.pts++;toast(`🎖️ Você chegou ao nível ${c.lvl}! +1 ponto de atributo`,'good')}}
function addLicao(k){if(!S.licoes.includes(k))S.licoes.push(k)}

function completeChapter(){
  const n=S.chapter;gainXP(100);
  if(n===1){addLicao('cliente');S.chapter=2;S.flags.beto=true;playScene('ch2')}
  else if(n===2){S.chapter=3;playScene('ch3')}
  else if(n===3){addLicao('paga');S.chapter=4;playScene('ch4')}
  else if(n===4){addLicao('cesta');S.chapter=5;S.flags.vortexOn=true;playScene('ch5')}
  else if(n===5){playScene('final1',()=>{if(S.chapter===5){addLicao('negocia');S.chapter=6;S.flags.ato1=true;save();renderView()}})}
  save();
}

function maybeEvent(){

/* ================== DIA ================== */
function endDay(){
  const rev=S.todayRev,cost=totCost();
  S.money-=cost;S.day++;S.dayT=0;S.todayRev=0;
  const decayMul=S.licoes.includes('paga')?.5:1;
  const quits=[];
  S.companies.forEach(c=>{
    const loss=compRevDay(c)<compCost(c);const fof=c.emps.filter(e=>e.trait==='fofoqueiro');
    c.emps.forEach(e=>{
      let d=-3+(S.money>=0?2:-8)+(S.ceo.attr.lid-1)*.5+(S.ceo.perfil==='lid'?2:0);
      if(loss)d-=2;d-=3*fof.filter(f=>f!==e).length;
      if(d<0){d*=decayMul;if(e.trait==='leal')d*=.5}
      e.moral=clamp(e.moral+d,0,100);
      if(e.moral<15){e.low=(e.low||0)+1}else e.low=0;
      if(e.low>=2&&!e.special)quits.push([c,e]);
    });
    if(c.mkt>0){c.mkt--;S.rep=clamp(S.rep+1+S.ceo.attr.car*.2,0,100)}
  });
  quits.forEach(([c,e])=>{c.emps=c.emps.filter(x=>x!==e);toast(`😞 ${esc(e.name)} pediu demissão da ${esc(c.name)} (moral baixa)`,'bad')});
  S.buffs.forEach(b=>b.d--);S.buffs=S.buffs.filter(b=>b.d>0);
  // reputação volta devagar para 30 quando muito alta sem marketing
  if(S.rep>60&&!S.companies.some(c=>c.mkt>0))S.rep-=.3;
  gainXP(10);
  // sede
  while(S.hq<HQS.length-1&&patrimonio()>=HQS[S.hq+1].min&&(S.hq+1!==1||S.chapter>=5)){S.hq++;toast(`🏢 Nova sede: ${HQS[S.hq].n}! Agora cabem ${HQS[S.hq].max} empresas.`,'good')}
  if(S.companies.length)toast(`📅 Dia ${S.day-1} · Receita <b class="green">${fmt(rev)}</b> · Custos <b class="red">${fmt(cost)}</b> · Lucro <b class="${rev-cost>=0?'green':'red'}">${fmt(rev-cost)}</b>`);
  // falência
  if(S.money<0){S.debt++;if(S.debt<3)toast(`⚠ Caixa negativo (${S.debt}/3). Corte custos!`,'bad')}else S.debt=0;
  if(S.debt>=3){S.debt=0;if(!S.flags.cida){S.flags.cida=1;S.money+=2000;playScene('falencia1')}else{S.flags.marcos=(S.flags.marcos||0)+1;S.money+=3000;playScene('falencia2')}}
  else maybeEvent();
  save();
  if(tab==='ceo'||tab==='story')renderView();
}

const T=32,TH=16;
function P(x,y,z=0){return [(x-y)*T,(x+y)*TH-z]}
function shade(hex,f){if(typeof hex!=='string'||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.round(clamp(f<1?v*f:v+(255-v)*(f-1),0,255));return `rgb(${m(r)},${m(g)},${m(b)})`}
function poly(ctx,pts,fill,stroke){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}}
const EDGE='rgba(20,18,30,.28)';
function box(ctx,x,y,w,d,h,col,z=0,top){const a=P(x,y,z),b=P(x+w,y,z),c=P(x+w,y+d,z),e=P(x,y+d,z);const u=p=>[p[0],p[1]-h];
  poly(ctx,[b,c,u(c),u(b)],shade(col,.7),EDGE);poly(ctx,[e,c,u(c),u(e)],shade(col,.86),EDGE);poly(ctx,[u(a),u(b),u(c),u(e)],top||shade(col,1.06),EDGE)}
function shadowOf(ctx,x,y,w,d,a=.18){poly(ctx,[P(x+.06,y+.1),P(x+w+.14,y+.1),P(x+w+.14,y+d+.16),P(x+.06,y+d+.16)],`rgba(10,8,20,${a})`)}
function flat(ctx,x,y,w,d,z,col){poly(ctx,[P(x,y,z),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z)],col)}
function vx(ctx,x0,x1,y,z0,z1,col){poly(ctx,[P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],col)}
function vy(ctx,y0,y1,x,z0,z1,col){poly(ctx,[P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)],col)}
function rrect(ctx,x,y,w,h,r,col,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(col){ctx.fillStyle=col;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}}
function ell(ctx,x,y,rx,ry,col,stroke){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);if(col){ctx.fillStyle=col;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}}
function ln(ctx,pts,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke()}
function softShadow(ctx,x,y,rx,ry,a=.3){const g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,`rgba(10,8,20,${a})`);g.addColorStop(1,'rgba(10,8,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}

  if(!c.empty)for(let i=0;i<4;i++){const n=slots(c,i);const es=c.emps.filter(e=>e.cargo===i);

  if(app)s.push(seg('ride',{path:back}),seg('park',{d:.7}));

/* ---------- Câmera e canvas principal ---------- */
const cams={};
function camFor(cv){if(!cams.main)cams.main={cx:24,cy:118,z:null};return cams.main}
function fitZoom(cv){return cv.clientWidth/660}
let lastLive=0;
const EMPTYCO={id:0,ramo:'alim',name:'ALUGA-SE',lvl:1,emps:[],mkt:0,empty:true};
function viewCompany(){return findCo(S.viewCo)||S.companies[0]||EMPTYCO}
function drawLive(now){
  if(now-lastLive<33)return;lastLive=now;
  const t=now/1000;const cv=$('gameCv');if(!cv||!cv.offsetParent)return;
  const c=viewCompany();
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const cam=camFor(cv);const fz=fitZoom(cv);if(cam.z==null)cam.z=fz;
  const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);
  const [s1,s2]=skyCol();const g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,s1);g.addColorStop(.55,s2);g.addColorStop(.56,'#6aa856');g.addColorStop(1,'#5f9a4f');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*cam.z,0,0,dpr*cam.z,dpr*(w/2-cam.cx*cam.z),dpr*(h/2-cam.cy*cam.z));ctx.__z=cam.z/fz;
  const hits=[];drawScene(ctx,c,t,hits);
  for(const hh of hits)if(hh.w){const p=P(hh.w[0],hh.w[1]);hh.x=p[0];hh.y=p[1]-18}
  cv._hits=hits;cv._view={w,h,cam};
}
function canvasWorld(cv,ev){const r=cv.getBoundingClientRect();const {w,h,cam}=cv._view||{};if(!cam)return null;const px=(ev.clientX-r.left)*(w/r.width),py=(ev.clientY-r.top)*(h/r.height);return [(px-w/2)/cam.z+cam.cx,(py-h/2)/cam.z+cam.cy]}
function hitAt(cv,ev){const p=canvasWorld(cv,ev);if(!p||!cv._hits)return null;let best=null,bd=1e9;for(const hh of cv._hits){const d=Math.hypot(hh.x-p[0],hh.y-p[1]);if(d<hh.r*1.2&&d<bd){bd=d;best=hh}}
  if(!best){const gx=(p[0]/T+p[1]/TH)/2,gy=(p[1]/TH-p[0]/T)/2;if(gx>0&&gx<RW&&gy>0&&gy<RD)return {type:'floor'}}return best}
function useHit(hh){
  const c=viewCompany();
  if(c.empty){openSheet(sheetNewCo,{});return}
  if(!hh)return;
  if(hh.type==='station')openSheet(sheetStation,{id:hh.cid,key:hh.key});
  else if(hh.type==='deco'||hh.type==='floor')openSheet(sheetDecor,{id:c.id,focus:hh.k});
  else if(hh.type==='hours')openSheet(sheetCo,{id:c.id});
}
function initCanvas(){
  const cv=$('gameCv');const pts=new Map();let moved=false,pinch0=0,z0=1,start=null;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;start=[e.clientX,e.clientY];if(pts.size===2){const [a,b]=[...pts.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);z0=camFor(cv).z}});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);const cam=camFor(cv);
    if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0)setZoom(cv,z0*d/pinch0);moved=true;return}
    const dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.hypot(e.clientX-start[0],e.clientY-start[1])>8)moved=true;if(moved){cam.cx-=dx/cam.z;cam.cy-=dy/cam.z;clampCam(cv)}});
  const up=e=>{if(pts.has(e.pointerId)){pts.delete(e.pointerId);if(!moved&&pts.size===0)useHit(hitAt(cv,e))}if(pts.size<2)pinch0=0};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId)});
  cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(cv,camFor(cv).z*(e.deltaY<0?1.12:.89))},{passive:false});
  $('zIn').onclick=()=>setZoom(cv,camFor(cv).z*1.3);$('zOut').onclick=()=>setZoom(cv,camFor(cv).z/1.3);
}
function setZoom(cv,z){const f=fitZoom(cv);camFor(cv).z=clamp(z,f*.75,f*3.6);clampCam(cv)}
function clampCam(cv){const cam=camFor(cv);cam.cx=clamp(cam.cx,-300,360);cam.cy=clamp(cam.cy,-110,400)}

function moto(ctx,x,y,hd,col,box2,t,moving,lvl=1){
  if(typeof hd==='number')hd=hd>0?'+x':'-x';
  const [sx,sy]=P(x,y);const [a,b]=AX[hd];
  softShadow(ctx,sx,sy+2,26,9,.4);

/* ---------- Câmera e toques (com área externa) ---------- */
function camFor(cv){if(!cams.main)cams.main={cx:95,cy:122,z:null};return cams.main}
function fitZoom(cv){return cv.clientWidth/720}
function clampCam(cv){const cam=camFor(cv);cam.cx=clamp(cam.cx,-300,560);cam.cy=clamp(cam.cy,-110,420)}
function hitAt(cv,ev){const p=canvasWorld(cv,ev);if(!p||!cv._hits)return null;let best=null,bd=1e9;
  for(const hh of cv._hits){if(hh.type==='ext')continue;const d=Math.hypot(hh.x-p[0],hh.y-p[1]);if(d<hh.r*1.2&&d<bd){bd=d;best=hh}}
  if(best)return best;
  const gx=(p[0]/T+p[1]/TH)/2,gy=(p[1]/TH-p[0]/T)/2;
  if(gx>0&&gx<RW&&gy>0&&gy<RD)return {type:'floor'};
  if(gx>=RW&&gx<12.4&&gy>=0&&gy<8.1)return {type:'ext',k:'beco'};
  if(gx>=12.4&&gx<18.2&&gy>=.5&&gy<8.1)return {type:'ext',k:'estac'};
  if(gy>=8&&gy<9.4&&gx>-1&&gx<12.4)return {type:'ext',k:'calcada'};
  return null}
function useHit(hh){
  const c=viewCompany();
  if(c.empty){openSheet(sheetNewCo,{});return}
  if(!hh)return;
  if(hh.type==='station')openSheet(sheetStation,{id:hh.cid,key:hh.key});
  else if(hh.type==='deco'||hh.type==='floor')openSheet(sheetDecor,{id:c.id,focus:hh.k});
  else if(hh.type==='ext')openSheet(sheetDecor,{id:c.id,focus:hh.k,ext:true});
  else if(hh.type==='hours')openSheet(sheetCo,{id:c.id});
}
function seg(type,o){o.type=type;if(o.path&&o.d==null)o.d=plen(o.path)/(type==='ride'||type==='drive'?RIDE:WALK);return o}

/* ================== MÚSICA (gerada no navegador) ================== */
const Music={ac:null,g:null,started:false,next:0,step:0,
  on:(()=>{try{return localStorage.getItem('ceo_music')!=='0'}catch(e){return true}})(),
  start(){if(!this.on)return;try{
    if(!this.ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=this.ac=new A();
      this.g=ac.createGain();this.g.gain.value=0;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;
      const dl=ac.createDelay();dl.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.3;const wet=ac.createGain();wet.gain.value=.35;
      this.g.connect(lp);lp.connect(ac.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
      this.next=ac.currentTime+.15;setInterval(()=>this.tick(),300)}
    if(this.ac.state!=='running')this.ac.resume();
    if(!this.started){this.started=true;this.g.gain.cancelScheduledValues(this.ac.currentTime);this.g.gain.setTargetAtTime(.17,this.ac.currentTime,1.5)}
  }catch(e){}},
  stop(){this.started=false;if(this.ac){this.g.gain.cancelScheduledValues(this.ac.currentTime);this.g.gain.setTargetAtTime(0,this.ac.currentTime,.3)}},
  toggle(){this.on=!this.on;try{localStorage.setItem('ceo_music',this.on?'1':'0')}catch(e){}this.on?this.start():this.stop();updMusicBtns()},
  tick(){const ac=this.ac;if(!ac||!this.started)return;while(this.next<ac.currentTime+1.5){this.bar(this.next,this.step);this.next+=4;this.step++}},
  note(f,t,d,type,vol,att){const ac=this.ac;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.1)},
  bar(t,i){const prog=[[48,55,59,64],[45,52,55,60],[41,48,52,57],[43,50,53,59]];const ch=prog[i%4];const hz=m=>440*Math.pow(2,(m-69)/12);
    ch.forEach(m=>{this.note(hz(m),t,4.8,'triangle',.03,1.4);this.note(hz(m)*1.004,t,4.8,'sine',.022,1.6)});
    this.note(hz(ch[0]-12),t,3.9,'sine',.07,.08);
    const arp=[ch[1]+12,ch[2]+12,ch[3]+12,ch[2]+12,ch[0]+24,ch[3]+12];
    for(let k=0;k<6;k++){if((i*5+k*3)%7===0)continue;this.note(hz(arp[(k+i)%arp.length]),t+k*.66+.12,1.8,'sine',.028,.015)}}
};
function updMusicBtns(){for(const id of ['bMusic','bMusic2']){const b=$(id);if(b)b.textContent=Music.on?'🔊':'🔇'}}
document.addEventListener('pointerdown',()=>{if(Music.on)Music.start()},{capture:true});
$('bMusic').onclick=e=>{e.stopPropagation();Music.toggle()};
$('bMusic2').onclick=e=>{e.stopPropagation();Music.toggle()};
updMusicBtns();

/* ================== ATUALIZAÇÃO AUTOMÁTICA ================== */
let updShown=false;
function checkUpdate(){
  if(location.protocol==='file:')return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.v||j.v===VERSION||updShown)return;updShown=true;
    $('updTxt').innerHTML=`<b>Nova atualização</b><small>${esc(j.nota||'Melhorias no jogo')} · atualizando em <span id="updN">5</span>s</small>`;
    $('updBar').classList.add('on');let n=5;
    const go=()=>{save();location.replace(location.pathname+'?v='+encodeURIComponent(j.v))};
    $('updGo').onclick=go;
    const iv=setInterval(()=>{if(storyOpen||evtOpen)return;n--;const el=$('updN');if(el)el.textContent=n;if(n<=0){clearInterval(iv);go()}},1000);
  }).catch(()=>{});
}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
(function(){let seen=null;try{seen=localStorage.getItem('ceo_ver')}catch(e){}
  $('homeUpd').innerHTML=`<b>Nova atualização</b> · ${UPDATE_NOTE} (v${VERSION})`;
  if(seen&&seen!==VERSION)setTimeout(()=>{if(S&&S.started)toast(`✅ Jogo atualizado: ${UPDATE_NOTE}`,'good')},3500);
  try{localStorage.setItem('ceo_ver',VERSION)}catch(e){}})();

/* ================== INTERFACE EM TELA CHEIA ================== */

  const vc=viewCompany();

}
function hudButtons(){

function toggleFull(){try{if(!document.fullscreenElement){const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch&&el.requestFullscreen().catch(()=>{})}else document.exitFullscreen()}catch(e){}}
function tryFull(){try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen&&!window.matchMedia('(display-mode: standalone)').matches&&!window.matchMedia('(display-mode: fullscreen)').matches)el.requestFullscreen().catch(()=>{})}catch(e){}}

/* ---------- Posto de trabalho (idle) ---------- */
function sheetStation(a){
  const c=findCo(a.id);if(!c)return head('Posto');const i=+a.key.split('_')[0],k=+a.key.split('_')[1];
  const [nm,ic]=stName(c,a.key);const lv=stLvl(c,a.key);const cg=RAMOS[c.ramo].cargos[i];
  const e=c.emps.filter(x=>x.cargo===i)[k]||null;const cost=stCost(c,a.key);
  let h=head(`${ic} ${nm}`)+`<div class="sh-body">`;
  h+=`<div class="card st-card"><div class="row" style="justify-content:space-between"><div><small class="mu">Nível do posto</small><div class="lvl-big">${lv}<span>/10</span></div></div><div style="text-align:right"><small class="mu">Bônus de produção</small><div class="green" style="font-size:20px;font-weight:900">+${(lv-1)*20}%</div></div></div><div class="pips" style="margin-top:10px">${Array.from({length:10},(_,j)=>`<i class="${j<lv?'f':''}"></i>`).join('')}</div></div>`;
  if(lv<10)h+=`<button class="btn" id="bUp" ${S.money<cost?'disabled':''}>⬆ Subir para nível ${lv+1} · ${fmt(cost)}<br><small style="font-weight:600">+20% de produção neste posto</small></button>`;
  else h+=`<div class="lockc">Posto no nível máximo ✨</div>`;
  h+=`<div style="height:12px"></div><div class="cg-h">${cg.e} ${cg.n} ${i<2?'<span class="ess">essencial</span>':''}</div>`;
  h+=e?empSlot(c,e):`<button class="slot free" data-hire="${i}">+ Contratar ${cg.n}</button>`;
  if(!isOpen(c))h+=`<div class="lockc" style="margin-top:8px">🌙 A loja está fechada agora. A equipe volta às ${hhTxt(hrsOf(c)[0])}.</div>`;
  return h+'</div>';
}
sheetStation.bind2=(a,p)=>{
  const c=findCo(a.id);if(!c)return;
  const b=p.querySelector('#bUp');if(b)b.onclick=()=>{const k=stCost(c,a.key);if(S.money<k)return;S.money-=k;c.sl=c.sl||{};c.sl[a.key]=stLvl(c,a.key)+1;gainXP(8);toast(`⬆ ${stName(c,a.key)[0]} nível ${c.sl[a.key]}!`,'good');save();renderSheet()};

  p.querySelectorAll('[data-emp]').forEach(x=>x.onclick=()=>openSheet(sheetEmp,{id:c.id,e:x.dataset.emp}));
};

/* ---------- Decoração ---------- */
function decoCost(c,k){return Math.round(RAMOS[c.ramo].custo*.3*Math.pow(1.8,dLvl(c,k))/50)*50}
function sheetDecor(a){
  const c=findCo(a.id);if(!c)return head('Decorar');const tot=decoTotal(c);
  let h=head('🎨 Decorar · '+esc(c.name))+`<div class="sh-body"><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><small class="mu">Ambiente da loja</small><div style="font-size:20px;font-weight:900">${tot} ponto${tot!==1?'s':''}</div></div><div style="text-align:right"><small class="mu">Bônus de receita</small><div class="green" style="font-size:20px;font-weight:900">+${tot*4}%</div></div></div><p class="mu" style="font-size:13px;margin:-2px 0 12px">Cada melhoria deixa a loja mais bonita, dá +4% de receita e atrai mais clientes.</p>`;
  for(const d of DECOR){const lv=dLvl(c,d.k);const max=d.names.length-1;const cost=decoCost(c,d.k);
    h+=`<div class="deco ${a.focus===d.k?'on':''}"><div class="e">${d.e}</div><div class="m"><b>${d.n}</b><small>${d.names[lv]}${lv<max?` → <span class="gold">${d.names[lv+1]}</span>`:''}</small><div class="pips sm">${Array.from({length:max},(_,j)=>`<i class="${j<lv?'f':''}"></i>`).join('')}</div></div>${lv<max?`<button class="btn sm" data-dk="${d.k}" ${S.money<cost?'disabled':''}>${fmt(cost)}</button>`:'<span class="gold" style="font-weight:800;font-size:13px">MÁX</span>'}</div>`}
  return h+'</div>';
}
sheetDecor.bind2=(a,p)=>{
  const c=findCo(a.id);if(!c)return;
  p.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{const k=b.dataset.dk;const cost=decoCost(c,k);if(S.money<cost)return;S.money-=cost;c.deco=c.deco||{};c.deco[k]=dLvl(c,k)+1;S.rep=clamp(S.rep+1,0,100);gainXP(10);const d=DECOR.find(x=>x.k===k);toast(`🎨 ${d.n}: ${d.names[c.deco[k]]}!`,'good');a.focus=k;save();renderSheet()});
};

/* ---------- Horário de funcionamento ---------- */
function hxCost(c){return Math.round(RAMOS[c.ramo].custo*.5*Math.pow(1.9,c.hx||0)/50)*50}
function hoursCard(c){
  const [o,cl]=hrsOf(c);const lv=c.hx||0;const nx=HOURS[lv+1];
  return `<div class="card hours"><div class="row" style="justify-content:space-between"><div><small class="mu">⏰ Horário de funcionamento</small><div style="font-size:18px;font-weight:900">${openLen(c)>=24?'Aberto 24 horas':`${hhTxt(o)} às ${hhTxt(cl)}`} <small class="mu">(${openLen(c)}h)</small></div></div><span class="pill-s ${isOpen(c)?'ok':'off'}">${isOpen(c)?'ABERTO':'FECHADO'}</span></div>
  ${nx?`<button class="btn sec sm" style="margin-top:10px" data-a="hx" ${S.money<hxCost(c)?'disabled':''}>Estender para ${nx[1]-nx[0]>=24?'24 horas':`${hhTxt(nx[0])} às ${hhTxt(nx[1])}`} · ${fmt(hxCost(c))}</button><small class="mu" style="display:block;margin-top:6px">Mais horas abertas = mais receita por dia. Salários não mudam.</small>`:'<small class="gold" style="display:block;margin-top:6px">Horário máximo: a loja não fecha nunca!</small>'}</div>`;
}

/* ================== DECORAR + ÁREA EXTERNA ================== */
function extCost(c,k){return Math.round(RAMOS[c.ramo].custo*.35*Math.pow(1.9,eLvl(c,k))/50)*50}
function extBonus(c){return eLvl(c,'estac')*6+eLvl(c,'calcada')*3}
function decoRow(c,d,lv,max,cost,attr,focus){return `<div class="deco ${focus?'on':''}" ${focus?'id="decoFocus"':''}><div class="e">${d.e}</div><div class="m"><b>${d.n}</b><small>${d.names[lv]}${lv<max?` → <span class="gold">${d.names[lv+1]}</span>`:''}</small>${d.d?`<small style="display:block;color:#9fd8b4">${d.d}</small>`:''}<div class="pips sm">${Array.from({length:max},(_,j)=>`<i class="${j<lv?'f':''}"></i>`).join('')}</div></div>${lv<max?`<button class="btn sm" ${attr} ${S.money<cost?'disabled':''}>${fmt(cost)}</button>`:'<span class="gold" style="font-weight:800;font-size:13px">MÁX</span>'}</div>`}
function sheetDecor(a){
  const c=findCo(a.id);if(!c)return head('Decorar');const tot=decoTotal(c);
  let h=head('🎨 Decorar · '+esc(c.name))+`<div class="sh-body"><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><small class="mu">Bônus do ambiente</small><div style="font-size:20px;font-weight:900">${tot+eLvl(c,'beco')+eLvl(c,'estac')+eLvl(c,'calcada')} melhorias</div></div><div style="text-align:right"><small class="mu">Receita extra</small><div class="green" style="font-size:20px;font-weight:900">+${tot*4+extBonus(c)}%</div></div></div>`;
  h+=`<div class="seg"><button class="${a.ext?'':'on'}" data-tab="in">🏠 Interior</button><button class="${a.ext?'on':''}" data-tab="ext">🌳 Área externa</button></div>`;
  if(!a.ext){h+=`<p class="mu" style="font-size:13px;margin:0 0 10px">Cada melhoria deixa a loja mais bonita, dá +4% de receita e atrai mais clientes.</p>`;
    for(const d of DECOR){const lv=dLvl(c,d.k);h+=decoRow(c,d,lv,d.names.length-1,decoCost(c,d.k),`data-dk="${d.k}"`,a.focus===d.k)}}
  else{h+=`<p class="mu" style="font-size:13px;margin:0 0 10px">O beco guarda as motos dos entregadores, o estacionamento traz clientes de carro e a calçada atrai quem passa na rua.</p>`;
    for(const d of EXTER){const lv=eLvl(c,d.k);h+=decoRow(c,d,lv,d.names.length-1,extCost(c,d.k),`data-ek="${d.k}"`,a.focus===d.k)}}
  return h+'</div>';
}
sheetDecor.bind2=(a,p)=>{
  const c=findCo(a.id);if(!c)return;
  p.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{a.ext=b.dataset.tab==='ext';a.focus=null;renderSheet()});
  p.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{const k=b.dataset.dk;const cost=decoCost(c,k);if(S.money<cost)return;S.money-=cost;c.deco=c.deco||{};c.deco[k]=dLvl(c,k)+1;S.rep=clamp(S.rep+1,0,100);gainXP(10);const d=DECOR.find(x=>x.k===k);toast(`🎨 ${d.n}: ${d.names[c.deco[k]]}!`,'good');a.focus=k;save();renderSheet()});
  p.querySelectorAll('[data-ek]').forEach(b=>b.onclick=()=>{const k=b.dataset.ek;const cost=extCost(c,k);if(S.money<cost)return;S.money-=cost;c.ext=c.ext||{};c.ext[k]=eLvl(c,k)+1;S.rep=clamp(S.rep+1,0,100);gainXP(12);const d=EXTER.find(x=>x.k===k);toast(`${d.e} ${d.n}: ${d.names[c.ext[k]]}!`,'good');a.focus=k;save();renderSheet()});
  const f=p.querySelector('#decoFocus');if(f&&!a._scrolled){a._scrolled=1;setTimeout(()=>f.scrollIntoView({block:'center'}),30)}
};

/* ================== LOOP ================== */
let last=performance.now(),acc=0,acc2=0;
function loop(now){
  const dt=Math.min(1,(now-last)/1000);last=now;
  if(S&&S.started&&!storyOpen&&!evtOpen){
    const h=hourNow();let anyOpen=false,rps=0;
    for(const c of S.companies){if(isOpen(c,h)){anyOpen=true;rps+=2*compRev(c)/DAY}}
    S.money+=rps*dt;S.todayRev+=rps*dt;S.earned+=rps*dt;
    S.fast=!anyOpen&&S.companies.length>0;
    S.dayT+=dt/DAY*(S.fast?3:1);if(S.dayT>=1)endDay();
    if(S.chapter>=1&&S.chapter<=5&&CHAPTERS[S.chapter].check())completeChapter();
  }
  if(S&&S.started&&!storyOpen)drawLive(now);
  acc+=dt;if(acc>.25){acc=0;updateLive()}
  acc2+=dt;if(acc2>3){acc2=0;if(sheetStack.length&&!storyOpen&&!evtOpen&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))renderSheet()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
